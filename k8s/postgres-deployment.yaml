apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fluid-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "fluid-ai-postgres"
        vault.hashicorp.com/agent-inject-secret-db-env: "secret/data/fluid-ai/db"
        vault.hashicorp.com/agent-inject-template-db-env: |
          {{- with secret "secret/data/fluid-ai/db" -}}
          export POSTGRES_DB="{{ .Data.data.name }}"
          export POSTGRES_USER="{{ .Data.data.user }}"
          export POSTGRES_PASSWORD="{{ .Data.data.password }}"
          {{- end -}}
    spec:
      serviceAccountName: fluid-ai-postgres
      containers:
        - name: postgres
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - ". /vault/secrets/db-env && exec docker-entrypoint.sh postgres"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "appdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "appdb"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
