name: CI/CD - Build and Deploy to Kind

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy (Windows binary)
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*windows-64bit.zip" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile trivy.zip
          Expand-Archive -Path trivy.zip -DestinationPath trivy_bin -Force
          echo "$PWD\trivy_bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Scan dependencies for vulnerabilities (Trivy - filesystem)
        run: |
          & "$PWD\trivy_bin\trivy.exe" fs --scanners vuln --severity HIGH,CRITICAL --format table --exit-code 0 -o trivy-fs-report.txt ./app

      - name: Build Docker image
        run: docker build -t fluid-ai-backend:latest ./app

      - name: Scan Docker image for vulnerabilities (Trivy)
        run: |
          & "$PWD\trivy_bin\trivy.exe" image --severity HIGH,CRITICAL --format table --exit-code 0 -o trivy-image-report.txt fluid-ai-backend:latest

      - name: Check Node.js is available (for Snyk CLI)
        run: |
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
            Write-Error "FATAL: npm not found on this self-hosted runner. Install Node.js to enable Snyk scanning."
            exit 1
          }

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Scan dependencies for vulnerabilities (Snyk)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        working-directory: ./app
        run: |
          snyk auth "$env:SNYK_TOKEN"
          snyk test --severity-threshold=high --json-file-output=../snyk-deps-report.json
          exit 0

      - name: Scan Docker image for vulnerabilities (Snyk)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test fluid-ai-backend:latest --severity-threshold=high --json-file-output=snyk-image-report.json
          exit 0

      - name: Show scan reports in logs
        run: |
          Write-Host "===== Trivy Filesystem/Dependency Scan ====="
          Get-Content trivy-fs-report.txt -ErrorAction SilentlyContinue
          Write-Host "===== Trivy Docker Image Scan ====="
          Get-Content trivy-image-report.txt -ErrorAction SilentlyContinue
          Write-Host "===== Snyk Dependency Scan ====="
          Get-Content snyk-deps-report.json -ErrorAction SilentlyContinue
          Write-Host "===== Snyk Docker Image Scan ====="
          Get-Content snyk-image-report.json -ErrorAction SilentlyContinue

      - name: Upload security reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            trivy-fs-report.txt
            trivy-image-report.txt
            snyk-deps-report.json
            snyk-image-report.json

      - name: Load image into local Kind cluster
        run: kind load docker-image fluid-ai-backend:latest --name devops-challenge

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/serviceaccounts.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/postgres-service.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Restart backend deployment (pick up new image)
        run: kubectl rollout restart deployment/backend -n fluid-ai

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend -n fluid-ai --timeout=120s

      - name: Verify pods are running
        run: kubectl get pods -n fluid-ai -o wide

      - name: Smoke test health endpoint
        run: |
          Start-Process -NoNewWindow -FilePath kubectl -ArgumentList "port-forward","svc/backend-service","8000:8000","-n","fluid-ai"
          Start-Sleep -Seconds 5
          Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing
